# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - name: Test
        # Read secrets into APP_KEY / APP_SECRET so that
        # src/workflow/translator.test.ts can hit the real Youdao API
        # instead of being skipped.
        env:
          APP_PLATFORM: Youdao
          APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: pnpm test
