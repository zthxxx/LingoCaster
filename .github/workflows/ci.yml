# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # media assets are stored in git-lfs; ray lint / ray build need real files
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Test
        # Read secrets into APP_KEY / APP_SECRET so that
        # src/workflow/translator.test.ts can hit the real Youdao API
        # instead of being skipped.
        env:
          APP_PLATFORM: Youdao
          APP_KEY: ${{ secrets.YOUDAO_APP_KEY }}
          APP_SECRET: ${{ secrets.YOUDAO_APP_SECRET }}
        run: npm test

  # Replaces the former husky commit-msg hook: enforce conventional commits in CI.
  # Config lives in .github/commitlintrc.yml so it is excluded from `ray publish`.
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: >
          npx --yes
          --package @commitlint/cli@21
          --package @commitlint/config-conventional@21
          commitlint
          --config .github/commitlintrc.yml
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
